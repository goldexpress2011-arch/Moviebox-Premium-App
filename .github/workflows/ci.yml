name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Smoke test FastAPI application
        env:
          MOVIEBOX_AFFILIATE_URL: https://moviebox.ph/?ref=demo
          APP_NAME: Moviebox Premium App
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app import app

          client = TestClient(app)

          health = client.get("/health")
          assert health.status_code == 200, health.text

          root = client.get("/")
          assert root.status_code == 200, root.text

          cfg = client.get("/api/config")
          assert cfg.status_code == 200, cfg.text

          resp = client.get("/go/moviebox", follow_redirects=False)
          assert resp.status_code in (301, 302, 307, 308), resp.status_code

          location = resp.headers.get("location", "")
          assert "moviebox.ph" in location.lower(), location

          print("Smoke tests passed")
          PY
