name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Smoke test FastAPI application
        env:
          MOVIEBOX_AFFILIATE_URL: https://moviebox.ph/
          APP_NAME: Moviebox Premium App
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app import app

          client = TestClient(app)

          assert client.get("/health").status_code == 200
          assert client.get("/").status_code == 200
          assert client.get("/api/config").status_code == 200

          response = client.get("/go/moviebox", follow_redirects=False)
          assert response.status_code == 307
          assert "moviebox.ph" in response.headers["location"]

          print("Smoke tests passed")
          PY
